function dishName(dish) {

}
// ---------- độ tươi (Test Contract v1.2): đọc được cả kho đếm (v1.1) lẫn kho cá thể {id, kind, fresh} ----------
const SPOILED_BELOW = 30, WARN_BELOW = 45;
function itemKind(it) { return typeof it === "string" ? it : ((it && it.kind) || ""); }
function itemFresh(it) { return (it && typeof it === "object" && typeof it.fresh === "number") ? it.fresh : null; }
function isSpoiledItem(it) { const f = itemFresh(it); return f !== null && f < SPOILED_BELOW; }
function freshColor(f) {
  if (f < SPOILED_BELOW) return "#ef5350";
  if (f < WARN_BELOW) return "#ffb300";
  if (f < 70) return "#fff176";
  return "#66bb6a";
}
function stockCounts(stock) {
  if (!Array.isArray(stock)) return stock || {};
  const m = {};
  stock.forEach((it) => { if (!isSpoiledItem(it)) m[itemKind(it)] = (m[itemKind(it)] || 0) + 1; });
  return m;
}
function computeAvailableStock(stock, customers) {
  if (Array.isArray(stock)) {
    // v1.2: kho là mảng cá thể, customers[].reserved là mảng id. Khả dụng = chưa ươn và chưa ai giữ.
    const held = new Set();
    (customers || []).forEach((c) => { if (Array.isArray(c.reserved)) c.reserved.forEach((id) => held.add(id)); });
    const avail = {}, reservedK = {};
    stock.forEach((it) => {
      const k = itemKind(it);
      if (held.has(it.id)) reservedK[k] = (reservedK[k] || 0) + 1;
      else if (!isSpoiledItem(it)) avail[k] = (avail[k] || 0) + 1;
    });
    return { avail, reserved: reservedK };
  }
  const reserved = {};
  (customers || []).forEach((c) => {
    const res = c.reserved || {};
    Object.keys(res).forEach((k) => {
      if (res[k] > 0) reserved[k] = (reserved[k] || 0) + res[k];
    });
  });
  const avail = {};
  Object.keys(stock || {}).forEach((k) => {
    const v = Math.max(0, (stock[k] || 0) - (reserved[k] || 0));
    if (v > 0) avail[k] = v;
  });
  return { avail, reserved };
}
function fmtItems(map) {
  return Object.keys(map || {}).filter((k) => map[k] > 0).sort()
    .map((k) => (KIND_NAME[k] || k) + "×" + map[k]).join(", ");
}
function cookableDishes(stock, menu) {
  stock = stockCounts(stock);
  const out = [];
  Object.keys(menu || {}).sort().forEach((id) => {
    const rec = (menu[id] && menu[id].recipe) || {};
    const ok = Object.keys(rec).every((k) => (stock[k] || 0) >= rec[k]);
    if (ok) out.push(dishName(id));
  });
  return out;
}

// ---------- bộ sprite pixel art (offscreen canvas) ----------
function makeSprite(rows, palette) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === "." || !palette[ch]) continue;
      g.fillStyle = palette[ch];
      g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}

function drawSprite(sp, x, y, w, h) {
  if (!sp) return;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(sp, Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function drawItemIcon(kind, cx, cy, size) {
  const img = FISH_IMG[kind];
  if (img && img.complete && img.naturalWidth > 0) {
    const ratio = img.naturalHeight / img.naturalWidth;
    const iw = size;
    const ih = Math.max(4, Math.round(iw * ratio));
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, Math.round(cx - iw / 2), Math.round(cy - ih / 2), iw, ih);
    return;
  }
  if (PIXEL_ICON[kind]) {
    drawSprite(PIXEL_ICON[kind], cx - size / 2, cy - size / 2, size, size);
    return;
  }
  ctx.fillStyle = kc(kind);
  ctx.fillRect(Math.round(cx - size * 0.4), Math.round(cy - size * 0.4), Math.round(size * 0.8), Math.round(size * 0.8));
}

function currentInput() {
  const mode = (snap && snap.phase) ? snap.phase : (snap ? snap.mode : "gather");
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (mode === "quan") dy = -dy;
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
async function sendPulse(btn, extra = {}) {
  if (btn === "pause") ui.pauseInflight = true;
  try {
    await fetch("/input", { method: "POST", body: JSON.stringify(Object.assign(currentInput(), extra, { [btn]: true })), headers: { "Content-Type": "application/json" } });
    await new Promise((r) => setTimeout(r, 24));
    await fetch("/input", { method: "POST", body: JSON.stringify(Object.assign(currentInput(), { [btn]: false })), headers: { "Content-Type": "application/json" } });
  } catch (e) {}
  if (btn === "pause") ui.pauseInflight = false;
}
async function sendBuy(kind) {
  try {
    await fetch("/input", { method: "POST", body: JSON.stringify(Object.assign(currentInput(), { buy: kind })), headers: { "Content-Type": "application/json" } });
  } catch (e) {}
}

function resetDayStats(rep) {
  ui.dayStats = { served: 0, left: 0, baseTotal: 0, tipTotal: 0, repStart: rep ?? null };
}
async function startNewGame() {
  ui.demoMode = false;
  ui.userPaused = false;
  ui.lastPauseSentAt = 0;
  ui.shopFeedback = "";
  ui.totalDishCounts = {};
  lastSent = "";
  down.clear();
  try {
    await fetch("/restart", { method: "POST" });
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
  } catch (e) {}
  ui.lastPhase = (snap && (snap.phase || snap.mode)) || "";
  if (snap && snap.mode === "day") {
    ui.screen = "day_intro";
    ui.introLeft = 4.0;
  } else {
    ui.screen = "play";
    ui.introLeft = 0;
  }
}
function togglePause() {
  if (ui.demoMode) return;
  if (ui.screen === "play" || ui.screen === "shop") {
    ui.userPaused = !ui.userPaused;
    ui.lastPauseSentAt = 0;
  }
}
function advanceIntroScreen() {
  if (ui.demoMode) {
    if (ui.screen === "day_intro") ui.screen = "evening_intro";
    else if (ui.screen === "evening_intro") ui.screen = "day_result";
    else if (ui.screen === "day_result") ui.screen = "shop";
    else if (ui.screen === "shop") ui.screen = "summary";
    else if (ui.screen === "summary") { ui.demoMode = false; ui.screen = "menu"; }
    return;
  }
  if (ui.screen === "day_intro" || ui.screen === "evening_intro") {
    ui.screen = "play";
    ui.introLeft = 0;
  } else if (ui.screen === "day_result") {
    if (snap && snap.phase === "shop") ui.screen = "shop";
    else startNewGame();
  }
}

function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (k === "escape" || k === "p") { togglePause(); e.preventDefault(); return; }
  if (ui.screen === "day_intro" || ui.screen === "evening_intro") {
    if (k === " " || k === "enter") { advanceIntroScreen(); e.preventDefault(); return; }
  }
  if (ui.screen === "shop") {
    if (k === "1") { ui.demoMode ? demoBuy("oxygen") : sendBuy("oxygen"); return; }
    if (k === "2") { ui.demoMode ? demoBuy("hp") : sendBuy("hp"); return; }
    if (k === "enter") { ui.demoMode ? advanceIntroScreen() : sendPulse("shop_done"); return; }
  }
  if (ui.screen === "day_result" && k === "enter") { advanceIntroScreen(); return; }
  if (ui.screen === "menu" && k === "enter") { startNewGame(); return; }

  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { startNewGame(); }
  else if (k === "h") { ui.highContrast = !ui.highContrast; }
  else if (k === "m") { ui.userPaused = false; ui.lastPauseSentAt = 0; ui.screen = "menu"; }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

cv.addEventListener("mousemove", (e) => {
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  ui.hoverIdx = ui.buttons.findIndex((b) => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h);
  cv.style.cursor = ui.hoverIdx >= 0 ? "pointer" : "default";
});
cv.addEventListener("click", (e) => {
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const hit = ui.buttons.find((b) => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h);
  if (hit && hit.onClick) hit.onClick();
});

const DEMO_FRESH = new URLSearchParams(location.search).get("demo") === "fresh";
function applyDemoFresh(s) {
  const pat = [100, 82, 64, 44, 31, 18, 95, 52, 29, 70, 100, 40];
  let n = 0;
  const toItems = (kinds) => kinds.map((k) => ({ id: "I" + (++n), kind: k, fresh: pat[(n - 1) % pat.length] }));
  if (s.mode === "gather" || s.phase === "gather") {
    const h = (s.hold && s.hold.length) ? s.hold.map(itemKind) : ["ca_loc", "ca_linh", "ca_keo", "bong_sung", "bong_dien_dien", "keo_neo", "ca_linh", "ca_loc"];
    if (!s.hold || !s.hold.length || typeof s.hold[0] === "string") s.hold = toItems(h);
  }
  if (s.stock && !Array.isArray(s.stock)) {
    const ks = [];
    Object.keys(s.stock).sort().forEach((k) => { for (let i = 0; i < s.stock[k]; i++) ks.push(k); });
    s.stock = toItems(ks);
  }
}

// ---------- poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    let s = await r.json();
    if (DEMO_FRESH) applyDemoFresh(s);
    if (firstPoll && s) {
      firstPoll = false;
      if (s.finished || (s.tick || 0) > 180) {
        await fetch("/restart", { method: "POST" });
        const r2 = await fetch("/state", { cache: "no-store" });
        s = await r2.json();
      }
      if (s.mode === "gather" || s.mode === "quan") {
        ui.screen = "play";
        ui.userPaused = false;
        ui.lastPauseSentAt = 0;
        ui.lastPhase = s.phase || s.mode;
      }
    }
    snap = s;
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

function smoothVal(key, target, speed = 0.22) {
  if (target === undefined || target === null || Number.isNaN(target)) return 0;
  const cur = vis.vals[key];
  if (cur === undefined) { vis.vals[key] = target; return target; }
  const alpha = 1 - Math.pow(1 - speed, Math.max(0.2, vis.dt * 60));
  const next = cur + (target - cur) * alpha;
  vis.vals[key] = Math.abs(target - next) < 0.0005 ? target : next;
  return vis.vals[key];
}
function smoothPos(id, tx, ty, speed = 0.35) {
  const cur = vis.pos[id];
  if (!cur || Math.hypot(tx - cur.x, ty - cur.y) > 4) {
    vis.pos[id] = { x: tx, y: ty };
    return vis.pos[id];
  }
  const alpha = 1 - Math.pow(1 - speed, Math.max(0.2, vis.dt * 60));
  cur.x += (tx - cur.x) * alpha;
  cur.y += (ty - cur.y) * alpha;
  return cur;
}
function spawnFloat(wx, wy, label, color) {
  vis.floats.push({ wx, wy, label, color, life: 1.15, maxLife: 1.15 });
}

function syncUiState() {
  if (!snap) return;
  const curDay = snap.day || 1;
  if (snap.mode !== vis.lastMode || snap.tick < vis.lastTick) {
    vis.vals = {}; vis.pos = {}; vis.bubbles = []; vis.bubbleCd = 0.5;
    vis.dragonflies = []; vis.frogs = {}; vis.splashes = []; vis.fishPrev = {};
    vis.floats = []; vis.seenEvents.clear();
    ui.lastPhase = snap.phase || snap.mode;
    ui.lastDay = curDay;
    resetDayStats(snap.reputation);
  }
  if (curDay !== ui.lastDay) {
    ui.lastDay = curDay;
    resetDayStats(snap.reputation);
  }
  vis.lastMode = snap.mode;
  vis.lastTick = snap.tick;
  if (ui.dayStats.repStart === null && snap.reputation !== undefined) ui.dayStats.repStart = snap.reputation;

  // Chuyển pha tự động khi chơi thật (--mode day hoặc kết thúc ca)
  const ph = snap.phase || snap.mode;
  if (!ui.demoMode && ui.screen !== "menu" && ui.screen !== "exit") {
    if (snap.finished && snap.reason === "days_complete") {
      ui.screen = "summary";
    } else if (ph !== ui.lastPhase) {
      if (ui.lastPhase === "gather" && ph === "quan") {
        ui.screen = "evening_intro";
        ui.introLeft = 3.5;
      } else if (ui.lastPhase === "quan" && ph === "shop") {
        ui.screen = "day_result";
      } else if (ui.lastPhase === "shop" && ph === "gather") {
        ui.screen = "day_intro";
        ui.introLeft = 4.0;
      }
    } else if (ph === "shop" && ui.screen === "play") {
      ui.screen = "shop";
    } else if (snap.finished && snap.mode === "quan" && ui.screen === "play") {
      ui.screen = "day_result";
    }
  }
  ui.lastPhase = ph;

  // Đếm ngược DayIntro / EveningIntro
  if (!ui.demoMode && (ui.screen === "day_intro" || ui.screen === "evening_intro") && ui.introLeft > 0) {
    ui.introLeft -= vis.dt;
    if (ui.introLeft <= 0) { ui.screen = "play"; ui.introLeft = 0; }
  }

  // Đồng bộ PauseGate thực với màn hình chờ
  if (!ui.demoMode && !snap.finished && !ui.pauseInflight && vis.now - ui.lastPauseSentAt > 0.35) {
    const wantPaused = (ui.screen === "menu" || ui.screen === "day_intro" || ui.screen === "evening_intro" || ui.screen === "day_result" || ui.screen === "exit") || ui.userPaused;
    const isPaused = snap.state === "paused";
    if (wantPaused !== isPaused) {
      ui.lastPauseSentAt = vis.now;
      sendPulse("pause");
    }
  }

  // Thu thập sự kiện cho popup nổi, Shop & DayResult
  const pPos = (snap.player && snap.player.pos) ? snap.player.pos : [8, 5];
  (snap.events || []).forEach((ev, idx) => {
    const key = `${ev.tick}:${ev.name}:${JSON.stringify(ev.data || {})}:${idx}`;
    if (vis.seenEvents.has(key)) return;
    vis.seenEvents.add(key);
    if (vis.seenEvents.size > 160) vis.seenEvents.delete(vis.seenEvents.values().next().value);
    const d = ev.data || {};
    if (ev.name === "gather") spawnFloat(pPos[0], pPos[1] - 1, `+${d.amount || 1} ${KIND_NAME[d.kind] || d.kind}`, "#b9f6ca");
    else if (ev.name === "fish_caught") spawnFloat(pPos[0], pPos[1] - 1, `+${d.yield || 1} ${KIND_NAME[d.kind] || d.kind}`, "#80d8ff");
    else if (ev.name === "hold_full") spawnFloat(pPos[0], pPos[1] - 1, "GIỎ ĐẦY!", "#ff8a80");
    else if (ev.name === "choke") spawnFloat(pPos[0], pPos[1] - 1, "-1 MÁU!", "#ff5252");
    else if (ev.name === "monster_hit") spawnFloat(pPos[0], pPos[1] - 1, `Bị ${d.monster_id} cắn!`, "#ea80fc");
    else if (ev.name === "cook_started") spawnFloat(pPos[0], pPos[1] + 0.8, `Nấu ${dishName(d.dish_id)}`, "#ffd180");
    else if (ev.name === "dish_ready") spawnFloat(pPos[0], pPos[1] + 0.8, "MÓN CHÍN!", "#a5d6a7");
    else if (ev.name === "dish_burnt") spawnFloat(pPos[0], pPos[1] + 0.8, "CHÁY MÓN!", "#ff8a80");
    else if (ev.name === "served") {
      ui.dayStats.served += 1;
      ui.totalDishCounts[d.dish_id] = (ui.totalDishCounts[d.dish_id] || 0) + 1;
      spawnFloat(pPos[0], pPos[1] + 0.8, d.tip > 0 ? `Phục vụ! Boa +${d.tip}k` : "Phục vụ!", "#fff59d");
    } else if (ev.name === "paid") {
      ui.dayStats.baseTotal += (d.base_price || 0);
      ui.dayStats.tipTotal += (d.tip || 0);
      spawnFloat(pPos[0], pPos[1] + 1.2, `+${d.amount || 0}k`, "#ffd740");
    } else if (ev.name === "customer_left" && d.reason === "patience") {
      ui.dayStats.left += 1;
      spawnFloat(pPos[0], pPos[1] + 1.2, "Khách bỏ đi!", "#ff8a80");
    } else if (ev.name === "bought") {
      ui.shopFeedback = `Đã mua ${d.upgrade === "oxygen" ? "Oxy" : "Áo phao"} cấp ${d.level} (-${d.price}k)!`;
    } else if (ev.name === "buy_failed") {
      const why = d.reason === "funds" ? "Không đủ tiền" : d.reason === "max_level" ? "Đã tối đa" : d.reason;
      ui.shopFeedback = `Mua thất bại: ${why}`;
    }
  });
}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

}
function text(s, x, y, o = {}) {

  ctx.textAlign = o.align || "left";

function pixelBox(x, y, w, h, bg = "#1a2430", border = "#090d12", hi = "#4f6278") {
  const rx = Math.round(x), ry = Math.round(y), rw = Math.round(w), rh = Math.round(h);
  const useBg = ui.highContrast ? "#000000" : bg;
  const useBorder = ui.highContrast ? "#ffffff" : border;
  const useHi = ui.highContrast ? "#ffea00" : hi;
  ctx.fillStyle = useBorder;
  ctx.fillRect(rx + 2, ry, rw - 4, rh);
  ctx.fillRect(rx, ry + 2, rw, rh - 4);
  ctx.fillStyle = useBg;
  ctx.fillRect(rx + 3, ry + 3, rw - 6, rh - 6);

  if (!ui.highContrast) {
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillRect(rx + 2, ry + rh - 4, rw - 4, 2);
    ctx.fillRect(rx + rw - 4, ry + 2, 2, rh - 4);
  }
}
function pixelBar(x, y, w, h, frac, color, label, segs = 10) {
  const rx = Math.round(x), ry = Math.round(y), rw = Math.round(w), rh = Math.round(h);
  const f = Math.max(0, Math.min(1, frac));
  pixelBox(rx, ry, rw, rh, "#111820", "#090d12", "#344457");
  const innerX = rx + 3, innerY = ry + 3, innerW = Math.max(2, rw - 6), innerH = Math.max(2, rh - 6);
  const fillW = Math.round(innerW * f);
  if (fillW > 0) {

    ctx.fillStyle = "rgba(255,255,255,.28)";

  if (segs > 1) {
    ctx.fillStyle = "rgba(9,13,18,.45)";
    for (let i = 1; i < segs; i++) {
      ctx.fillRect(innerX + Math.round((innerW * i) / segs), innerY, 1, innerH);

  }
  if (label) text(label, rx + rw / 2, ry + rh - 5, { size: 18, align: "center" });
}

// ----- hiệu ứng nhân vật người thật, chuồn chuồn, ếch nhảy -----
function drawLimb(x1, y1, len1, a1, len2, a2, w, col, endCol) {
  const mx = x1 + Math.cos(a1) * len1, my = y1 + Math.sin(a1) * len1;
  const ex = mx + Math.cos(a2) * len2, ey = my + Math.sin(a2) * len2;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(mx, my); ctx.lineTo(ex, ey); ctx.stroke();
  if (endCol) {
    ctx.fillStyle = endCol;
    ctx.beginPath(); ctx.arc(ex, ey, w * 0.55, 0, Math.PI * 2); ctx.fill();
  }
}

function drawUtSenSwimmer(px, py, s, p, moving, underwater) {
  const sc = Math.max(0.85, s * 0.085);
  const hd = ((p.heading_deg || 0) % 360 + 360) % 360;
  const t = vis.now;
  ctx.save();
  ctx.translate(px, py);

  if (!underwater && !moving) {
    // Đứng nước thư thái trên mặt sông
    const bob = Math.sin(t * 2.4) * 1.5;
    const kick = Math.sin(t * 2.6) * 0.25;
    const arm = Math.sin(t * 2.2) * 0.35;
    ctx.translate(0, bob);
    drawLimb(-3 * sc, 5 * sc, 7 * sc, Math.PI * 0.52 + kick, 6 * sc, Math.PI * 0.56 - kick * 0.5, 3.2 * sc, "#222831", "#f4c7a1");
    drawLimb(3 * sc, 5 * sc, 7 * sc, Math.PI * 0.48 - kick, 6 * sc, Math.PI * 0.44 + kick * 0.5, 3.2 * sc, "#222831", "#f4c7a1");
    drawLimb(-4 * sc, -3 * sc, 5.5 * sc, Math.PI * 0.85 + arm, 5 * sc, Math.PI * 0.72, 2.8 * sc, "#a45b39", "#f4c7a1");
    ctx.fillStyle = "#b8643c";
    ctx.beginPath(); ctx.ellipse(0, 0, 5 * sc, 7 * sc, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#c89d54";
    ctx.fillRect(-5 * sc, -2 * sc, 3.2 * sc, 6 * sc); // giỏ lưới sau lưng
    ctx.fillStyle = "#f4c7a1";
    ctx.beginPath(); ctx.arc(0, -10 * sc, 4.5 * sc, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1c1715";
    ctx.beginPath(); ctx.arc(-1 * sc, -11 * sc, 4.4 * sc, Math.PI * 0.9, Math.PI * 2.05); ctx.fill();
    ctx.beginPath(); ctx.arc(-4.5 * sc, -13 * sc, 2.3 * sc, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2b211e"; ctx.fillRect(-4.2 * sc, -6.5 * sc, 8.4 * sc, 2.2 * sc); // khăn rằn
    ctx.fillStyle = "#6fe3ff"; ctx.fillRect(1 * sc, -11.5 * sc, 3.8 * sc, 2.2 * sc); // kính lặn
    drawLimb(4 * sc, -3 * sc, 5.5 * sc, Math.PI * 0.15 - arm, 5 * sc, Math.PI * 0.28, 2.8 * sc, "#b8643c", "#f4c7a1");
    ctx.restore();
    return;
  }

  // Tư thế bơi ngang có động tác quạt tay & đạp chân 2 đốt
  if (hd > 90 && hd < 270) { ctx.scale(-1, 1); ctx.rotate(((180 - hd) * Math.PI) / 180); }
  else ctx.rotate((hd * Math.PI) / 180);

  const ph = t * (moving ? 5.4 : 2.1);
  const legA = Math.sin(ph * 1.5) * 0.42;
  const legB = Math.sin(ph * 1.5 + Math.PI) * 0.42;
  const armSweep = Math.sin(ph) * 0.95;
  const armReach = Math.cos(ph) * 0.4;

  // Tay sau & chân sau
  drawLimb(4 * sc, -1 * sc, 6.5 * sc, -0.35 - armSweep * 0.6, 6 * sc, -0.15 - armSweep * 0.9, 2.6 * sc, "#8f4b2d", "#e3b38b");
  drawLimb(-8 * sc, -1 * sc, 7.5 * sc, Math.PI + legB * 0.7, 7 * sc, Math.PI + legB * 1.35, 3.2 * sc, "#1a1f26", "#e3b38b");

  // Thân áo bà ba + giỏ sau lưng + chân trước
  ctx.fillStyle = "#b8643c";
  ctx.beginPath(); ctx.ellipse(-1 * sc, 0, 8.5 * sc, 4.6 * sc, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#c89d54";
  ctx.fillRect(-5 * sc, -6.5 * sc, 6.5 * sc, 3.6 * sc);
  ctx.strokeStyle = "#5c3d1e"; ctx.lineWidth = 1; ctx.strokeRect(-5 * sc, -6.5 * sc, 6.5 * sc, 3.6 * sc);
  drawLimb(-8 * sc, 1.5 * sc, 7.5 * sc, Math.PI + legA * 0.7, 7 * sc, Math.PI + legA * 1.35, 3.4 * sc, "#222831", "#f4c7a1");

  // Đầu, búi tóc, khăn rằn, kính lặn
  ctx.fillStyle = "#2b211e";
  ctx.fillRect(5 * sc, -4 * sc, 2.6 * sc, 8 * sc);
  ctx.fillStyle = "#f4eec8";
  ctx.fillRect(5.5 * sc, -2.5 * sc, 1.4 * sc, 1.8 * sc);
  ctx.fillRect(5.5 * sc, 0.8 * sc, 1.4 * sc, 1.8 * sc);
  ctx.fillStyle = "#f4c7a1";
  ctx.beginPath(); ctx.arc(10.5 * sc, -0.5 * sc, 4.5 * sc, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#1c1715";
  ctx.beginPath(); ctx.arc(9.8 * sc, -1.5 * sc, 4.4 * sc, Math.PI * 0.75, Math.PI * 1.9); ctx.fill();
  ctx.beginPath(); ctx.arc(6.5 * sc, -4.5 * sc, 2.3 * sc, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#6fe3ff";
  ctx.fillRect(11.6 * sc, -2.6 * sc, 3.4 * sc, 2.6 * sc);
  ctx.strokeStyle = "#10202b"; ctx.lineWidth = 1; ctx.strokeRect(11.6 * sc, -2.6 * sc, 3.4 * sc, 2.6 * sc);

  // Tay trước quạt nước
  drawLimb(4 * sc, 2 * sc, 6.8 * sc, 0.45 + armSweep + armReach * 0.25, 6.2 * sc, 0.25 + armSweep * 1.35, 2.9 * sc, "#c77248", "#f4c7a1");
  ctx.restore();
}

function drawBlock25D(cx, baseY, w, d, h, topCol, frontCol, borderCol = "#1a110b", hiCol = "rgba(255,255,255,0.22)") {

function hashStr(s) {
  let h = 2166136261;
  const str = String(s || "");
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function drawUtSen25D(px, py, s, vx, vz, moving, handDish) {
  const sc = Math.max(1.0, s * 0.044);
  if (!vis.quanFacing) vis.quanFacing = { x: 0, z: -1 };
  if (Math.hypot(vx || 0, vz || 0) > 0.15) {
    vis.quanFacing.x = vx;
    vis.quanFacing.z = vz;
  }
  const fx = vis.quanFacing.x, fz = vis.quanFacing.z;
  const facingBack = fz > 0.35 && Math.abs(fz) >= Math.abs(fx) * 0.7;
  const facingX = Math.abs(fx) > 0.2 ? (fx > 0 ? 1 : -1) : 0;
  const step = moving ? Math.round(Math.sin(vis.now * 12) * 3.5 * sc) : 0;
  const bob = moving ? Math.abs(Math.round(Math.cos(vis.now * 12) * 1.5 * sc)) : Math.round(Math.sin(vis.now * 2.5) * 0.6 * sc);
  const by = Math.round(py);
  const rx = Math.round(px);

  // Bóng đổ mặt sàn
  ctx.fillStyle = "rgba(12,8,4,0.45)";
  ctx.fillRect(Math.round(rx - 9 * sc), Math.round(by - 3 * sc), Math.round(18 * sc), Math.round(7 * sc));

  // Chân quần đen + dép
  const lLegY = by - 9 * sc + (step > 0 ? -step * 0.6 : 0);
  const rLegY = by - 9 * sc + (step < 0 ? step * 0.6 : 0);
  pxRect(rx - 5.5 * sc, lLegY, 4 * sc, 8 * sc, "#1e242b");
  pxRect(rx + 1.5 * sc, rLegY, 4 * sc, 8 * sc, "#181d23");
  pxRect(rx - 6 * sc, lLegY + 7 * sc, 4.5 * sc, 2.5 * sc, "#8c5b36");
  pxRect(rx + 1.5 * sc, rLegY + 7 * sc, 4.5 * sc, 2.5 * sc, "#754a2b");

  // Thân áo bà ba (kèm bóng tà áo)
  const torsoY = by - 21 * sc - bob;
  pxRect(rx - 7 * sc, torsoY, 14 * sc, 13 * sc, "#1a110b");
  pxRect(rx - 6 * sc, torsoY + 1 * sc, 12 * sc, 11 * sc, "#b8643c");
  pxRect(rx - 6 * sc, torsoY + 9 * sc, 12 * sc, 3 * sc, "#964d2a");
  if (!facingBack) {
    pxRect(rx - 0.8 * sc, torsoY + 2 * sc, 1.6 * sc, 9 * sc, "#d9926c");
    pxRect(rx - 0.5 * sc, torsoY + 4 * sc, 1.2 * sc, 1.2 * sc, "#f5e6c8");
    pxRect(rx - 0.5 * sc, torsoY + 7 * sc, 1.2 * sc, 1.2 * sc, "#f5e6c8");

  pxRect(rx - 5.5 * sc, torsoY - 1 * sc, 11 * sc, 3.2 * sc, "#2b211e");

  pxRect(rx - 0.5 * sc, torsoY, 1.8 * sc, 1.5 * sc, "#f4eec8");
  pxRect(rx + 3 * sc, torsoY, 1.8 * sc, 1.5 * sc, "#f4eec8");

  // Đầu & mái tóc / búi tóc
  const headY = torsoY - 11.5 * sc;
  pxRect(rx - 6 * sc, headY, 12 * sc, 11 * sc, "#1a110b");
  if (facingBack) {
    pxRect(rx - 5 * sc, headY + 1 * sc, 10 * sc, 9 * sc, "#1c1715");
    pxRect(rx - 2.5 * sc, headY + 2 * sc, 5 * sc, 4 * sc, "#2d2522");
  } else {
    pxRect(rx - 5 * sc, headY + 3 * sc, 10 * sc, 7 * sc, "#f4c7a1");
    pxRect(rx - 5 * sc, headY + 1 * sc, 10 * sc, 3.2 * sc, "#1c1715");
    pxRect(rx - 5.5 * sc, headY + 3 * sc, 2 * sc, 4 * sc, "#1c1715");
    pxRect(rx + 3.5 * sc, headY + 3 * sc, 2 * sc, 4 * sc, "#1c1715");
    pxRect(rx - 2.5 * sc, headY - 2 * sc, 5 * sc, 2.5 * sc, "#1c1715");
    const eyeShift = facingX * 1.4 * sc;
    pxRect(rx - 2.6 * sc + eyeShift, headY + 5.6 * sc, 1.6 * sc, 2 * sc, "#141010");
    pxRect(rx + 1.4 * sc + eyeShift, headY + 5.6 * sc, 1.6 * sc, 2 * sc, "#141010");
    pxRect(rx - 0.8 * sc + eyeShift * 0.7, headY + 8.3 * sc, 2 * sc, 1 * sc, "#b86b52");
  }

  // Đôi tay: bưng khay món hoặc đánh tay khi đi
  if (handDish) {
    const trayY = torsoY + 3 * sc;
    pxRect(rx - 9 * sc, torsoY + 3 * sc, 3.2 * sc, 4 * sc, "#c77248");
    pxRect(rx + 5.8 * sc, torsoY + 3 * sc, 3.2 * sc, 4 * sc, "#c77248");
    drawBlock25D(rx, trayY + 5 * sc, 18 * sc, 6 * sc, 2.5 * sc, "#a86b35", "#6e421c", "#1c1108");
    drawSprite(PIXEL_ICON.pot, rx - 6.5 * sc, trayY - 8.5 * sc, 13 * sc, 12 * sc);
    // Khói bốc nhẹ từ nồi
    const stOff = (vis.now * 16) % 8;
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.fillRect(Math.round(rx - 2 * sc), Math.round(trayY - (10 + stOff) * sc), Math.max(2, Math.round(2 * sc)), Math.max(2, Math.round(2 * sc)));
  } else {
    const armOff = Math.round(step * 0.75);
    pxRect(rx - 9.5 * sc, torsoY + 2 * sc + armOff, 3 * sc, 7 * sc, "#a45834");
    pxRect(rx - 9.5 * sc, torsoY + 8 * sc + armOff, 3 * sc, 2.5 * sc, "#f4c7a1");
    pxRect(rx + 6.5 * sc, torsoY + 2 * sc - armOff, 3 * sc, 7 * sc, "#a45834");
    pxRect(rx + 6.5 * sc, torsoY + 8 * sc - armOff, 3 * sc, 2.5 * sc, "#f4c7a1");
  }
}

function drawStove25D(st, bx, by, s, animF) {
  const bw = Math.round(1.65 * s), bd = Math.round(0.65 * s), bh = Math.round(0.72 * s);
  const topCol = st.state === "cooking" ? "#c97a3e" : st.state === "ready" ? "#56a64b" : "#6b7480";
  const frontCol = st.state === "cooking" ? "#7a3b1e" : st.state === "ready" ? "#34692d" : "#444c57";
  // Bóng đổ dưới chân bếp
  ctx.fillStyle = "rgba(12,8,4,0.42)";
  ctx.fillRect(Math.round(bx - bw / 2 - 4), Math.round(by - bd + 3), bw + 8, bd + 5);

  drawBlock25D(bx, by, bw, bd, bh, topCol, frontCol, "#1c120c");
  const yTop = Math.round(by - bd - bh);
  const yFront = yTop + bd;

  // Chi tiết gạch xây mặt trước & cửa lò vòm
  pxRect(bx - bw * 0.42, yFront + 5, bw * 0.84, 2, "rgba(0,0,0,0.22)");
  const archW = Math.round(bw * 0.34), archH = Math.round(bh * 0.62);
  const archX = Math.round(bx - archW / 2), archY = Math.round(by - archH);
  pxRect(archX + 3, archY - 3, archW - 6, archH + 3, "#1b110c");
  pxRect(archX, archY + 2, archW, archH - 2, "#1b110c");

  // Kiềng bếp & phụ kiện mặt bếp trên
  pxRect(bx - bw * 0.36, yTop + bd * 0.25, bw * 0.42, bd * 0.55, "#232830");
  pxRect(bx - bw * 0.30, yTop + bd * 0.34, bw * 0.30, bd * 0.38, "#12161c");
  // Thớt gỗ + chén nhỏ bên phải bếp
  pxRect(bx + bw * 0.14, yTop + bd * 0.28, bw * 0.24, bd * 0.42, "#b5844c");
  pxRect(bx + bw * 0.19, yTop + bd * 0.34, bw * 0.14, bd * 0.28, "#f0e3c7");

  if (st.state === "cooking") {
    // Lửa nhảy múa trong cửa lò
    const fl = animF % 2 === 0;
    pxRect(archX + 4, archY + archH * 0.42, archW - 8, archH * 0.52, "#ff6d00");
    pxRect(archX + (fl ? 6 : 9), archY + archH * 0.25, Math.max(4, archW - 14), archH * 0.55, "#ffea00");
    // Nồi đang nấu trên bếp + hơi nước
    const potSz = Math.round(0.75 * s);
    drawSprite(PIXEL_ICON.pot, bx - bw * 0.15 - potSz / 2, yTop - potSz * 0.55, potSz, potSz);
    for (let k = 0; k < 3; k++) {
      const ph = ((vis.now * 1.4 + k * 0.33) % 1);
      ctx.fillStyle = `rgba(245,250,255,${(1 - ph) * 0.7})`;
      ctx.fillRect(Math.round(bx - bw * 0.15 + Math.sin(vis.now * 5 + k) * 5 - 2), Math.round(yTop - potSz * 0.65 - ph * 22), 4, 4);
    }
  } else if (st.state === "ready") {
    // Đốm than hồng + nồi món chín nảy lên
    pxRect(archX + 5, archY + archH * 0.65, archW - 10, archH * 0.3, "#bf360c");
    const potSz = Math.round(0.82 * s);
    const bounce = Math.round(Math.sin(vis.now * 6) * 2.5);
    drawSprite(PIXEL_ICON.pot, bx - bw * 0.12 - potSz / 2, yTop - potSz * 0.6 + bounce, potSz, potSz);
  }
  text(st.id, bx + bw * 0.3, by - 6, { size: 18, align: "center", color: "#fff59d" });
}

const CUST_COLORS = ["#66bb6a", "#ec407a", "#42a5f5", "#ab47bc", "#ffa726", "#26a69a"];
function drawTableAndCustomer25D(tb, c, tx, ty, s, patMax) {
  const tw = Math.round(1.48 * s), td = Math.round(0.46 * s), th = Math.round(0.15 * s);
  const legH = Math.round(0.36 * s);
  const sc = Math.max(1.0, s * 0.040);

  // Bóng đổ dưới bàn & ghế
  ctx.fillStyle = "rgba(12,8,4,0.4)";
  ctx.fillRect(Math.round(tx - tw / 2 - 4), Math.round(ty - td + 2), tw + 8, td + 6);

  // Ghế đẩu gỗ phía sau & bên cạnh
  drawBlock25D(tx, ty - td + 2, 16 * sc, 5 * sc, 6 * sc, "#8c582b", "#5c3718", "#1f1208");
  drawBlock25D(tx - tw / 2 - 8 * sc, ty - 2 * sc, 11 * sc, 4 * sc, 5 * sc, "#8c582b", "#5c3718", "#1f1208");

  // Khách hàng 2.5D ngồi trên ghế phía sau (bàn sẽ che phần hông/đầu gối tạo chiều sâu 2.5D)
  if (c) {
    const h = hashStr(c.id);
    const coat = CUST_COLORS[h % CUST_COLORS.length];
    const hasHat = (h % 3) !== 0;
    const lowPat = c.state !== "eating" && c.patience_ticks_left !== undefined && (c.patience_ticks_left / patMax) < 0.25;
    const jx = lowPat ? Math.round(Math.sin(vis.now * 28) * 2) : 0;
    const eatBob = c.state === "eating" ? Math.round(Math.abs(Math.sin(vis.now * 8)) * 2.5) : 0;
    const cx = Math.round(tx + jx);
    const cy = Math.round(ty - td * 1.15 - legH * 0.4 + eatBob);

    // Thân người ngồi
    pxRect(cx - 7 * sc, cy - 12 * sc, 14 * sc, 13 * sc, "#1a110b");
    pxRect(cx - 6 * sc, cy - 11 * sc, 12 * sc, 11 * sc, coat);
    // Đầu
    const hy = cy - 22 * sc;
    pxRect(cx - 5.5 * sc, hy, 11 * sc, 10 * sc, "#1a110b");
    pxRect(cx - 4.5 * sc, hy + 2 * sc, 9 * sc, 7 * sc, "#f2c39b");
    pxRect(cx - 2.4 * sc, hy + 5 * sc, 1.4 * sc, 1.8 * sc, "#141010");
    pxRect(cx + 1.2 * sc, hy + 5 * sc, 1.4 * sc, 1.8 * sc, "#141010");
    if (hasHat) {
      // Nón lá pixel
      pxRect(cx - 8.5 * sc, hy + 1 * sc, 17 * sc, 2.5 * sc, "#e6c77a");
      pxRect(cx - 6 * sc, hy - 1.5 * sc, 12 * sc, 2.5 * sc, "#d4b05c");
      pxRect(cx - 3 * sc, hy - 3.5 * sc, 6 * sc, 2 * sc, "#e6c77a");
    } else {
      pxRect(cx - 4.5 * sc, hy + 1 * sc, 9 * sc, 2.5 * sc, "#1d1715");
    }
  }

  // 4 Chân bàn gỗ chạm sàn
  pxRect(tx - tw / 2 + 4, ty - td - legH + 2, 5, legH, "#3b210e");
  pxRect(tx + tw / 2 - 9, ty - td - legH + 2, 5, legH, "#3b210e");
  pxRect(tx - tw / 2 + 2, ty - legH, 6, legH, "#4f2e15");
  pxRect(tx + tw / 2 - 8, ty - legH, 6, legH, "#4f2e15");

  // Mặt bàn dày 2.5D nằm khít trên 4 chân
  const tableBaseY = ty - legH + 4;
  drawBlock25D(tx, tableBaseY, tw, td, th, "#9c6635", "#69411e", "#261408");
  const topY = Math.round(tableBaseY - td - th);
  // Đường vân mặt bàn & khăn trải bàn giữa
  pxRect(tx - tw * 0.42, topY + td * 0.48, tw * 0.84, 2, "rgba(62,36,17,0.35)");
  pxRect(tx - tw * 0.18, topY + td * 0.16, tw * 0.36, td * 0.68, "#dfd3b8");

  // Nếu có khách: vẽ tay đặt lên bàn; nếu đang ăn: vẽ nồi/tô thức ăn trên mặt bàn
  if (c) {
    const jx = (c.state !== "eating" && c.patience_ticks_left !== undefined && (c.patience_ticks_left / patMax) < 0.25) ? Math.round(Math.sin(vis.now * 28) * 2) : 0;
    pxRect(tx + jx - 6 * sc, topY + td * 0.18, 3 * sc, 3 * sc, "#f2c39b");
    pxRect(tx + jx + 3 * sc, topY + td * 0.18, 3 * sc, 3 * sc, "#f2c39b");
    if (c.state === "eating") {
      const dishSz = Math.round(10 * sc);
      drawSprite(PIXEL_ICON.pot, tx - dishSz / 2, topY + td * 0.15 - dishSz * 0.45, dishSz, dishSz);
      const stPh = (vis.now * 1.5) % 1;
      ctx.fillStyle = `rgba(255,255,255,${(1 - stPh) * 0.65})`;
      ctx.fillRect(Math.round(tx - 1), Math.round(topY - 6 - stPh * 12), 3, 3);
    }
  }
  text(tb.id, tx, ty - 2, { size: 18, align: "center", color: "#fff59d" });
}

function updateAndDrawDragonflies(sx, sy, X, s) {
  if (!vis.dragonflies.length) {
    const cols = ["#ef5350", "#ffd54f", "#4dd0e1"];
    for (let i = 0; i < 3; i++) {
      const startX = 14 + i * 26;
      vis.dragonflies.push({ x: startX, d: -1.1 - (i % 2) * 0.6, tx: startX + 8, td: -0.9, hover: 0.6 + i * 0.4, dir: 1, col: cols[i] });
    }
  }
  vis.dragonflies.forEach((df, idx) => {
    if (df.hover > 0) {
      df.hover -= vis.dt;
      df.d += Math.sin(vis.now * 5 + idx) * 0.18 * vis.dt;
      if (df.hover <= 0) {
        df.tx = Math.max(6, Math.min(X - 6, df.x + (Math.random() - 0.5) * 28));
        df.td = -0.35 - Math.random() * 1.9;
      }
    } else {
      const dx = df.tx - df.x, dd = df.td - df.d, dist = Math.hypot(dx, dd);
      if (dist < 0.35) {
        df.hover = 0.8 + Math.random() * 1.1;
      } else {
        const spd = 4.2;
        df.x += (dx / dist) * spd * vis.dt;
        df.d += (dd / dist) * spd * vis.dt;
        if (Math.abs(dx) > 0.05) df.dir = dx >= 0 ? 1 : -1;
      }
    }
    const fx = sx(df.x), fy = sy(df.d);
    const flap = Math.sin(vis.now * 44 + idx * 2) * 5;
    ctx.save();
    ctx.translate(fx, fy);
    ctx.scale(df.dir, 1);
    ctx.fillStyle = "rgba(232,248,255,0.68)";
    ctx.beginPath(); ctx.ellipse(-1, -4 - flap * 0.35, 5, 2.2, -0.35, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-3, -3 + flap * 0.25, 4.5, 2, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = df.col; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(4, 0); ctx.stroke();
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(4.5, 0, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
}

function updateAndDrawFrogs(nodes, p, sx, sy, s) {
  (nodes || []).forEach((n) => {
    if (n.kind !== "bong_dien_dien") return;
    let fr = vis.frogs[n.id];
    if (!fr) {
      fr = { state: "perched", x: n.pos[0], d: 0, vx: 0, vd: 0, timer: 0, dir: 1 };
      vis.frogs[n.id] = fr;
    }
    const distP = p ? Math.hypot(p.pos[0] - n.pos[0], p.pos[1] - n.pos[1]) : 99;
    if (fr.state === "perched") {
      fr.x = n.pos[0]; fr.d = -0.15;
      if (distP <= 4.5) {
        fr.state = "jumping";
        fr.dir = (p && p.pos[0] <= n.pos[0]) ? 1 : -1;
        fr.vx = fr.dir * 3.1;
        fr.vd = -4.3;
      }
    } else if (fr.state === "jumping") {
      fr.x += fr.vx * vis.dt;
      fr.vd += 11.5 * vis.dt;
      fr.d += fr.vd * vis.dt;
      if (fr.d >= 0) {
        fr.d = 0.05;
        fr.state = "submerged";
        fr.timer = 6.0;
        vis.splashes.push({ x: fr.x, life: 0.45 });
      }
    } else if (fr.state === "submerged") {
      fr.d = Math.min(1.1, fr.d + 0.9 * vis.dt);
      fr.timer -= vis.dt;
      if (fr.timer <= 0 && distP > 5.5) fr.state = "perched";
    }

    if (fr.state === "submerged" && fr.timer < 5.2) return;
    const fx = sx(fr.x), fy = sy(fr.d);
    const sc = Math.max(0.85, s * 0.08);
    ctx.save();
    ctx.translate(fx, fy);
    ctx.scale(fr.dir, 1);
    if (fr.state === "submerged") ctx.globalAlpha = Math.max(0, (fr.timer - 5.2) / 0.8);
    if (fr.state === "jumping") {
      ctx.strokeStyle = "#388e3c"; ctx.lineWidth = 2.6 * sc; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-3 * sc, 2 * sc); ctx.lineTo(-10 * sc, 6 * sc); ctx.stroke();
    } else {
      ctx.fillStyle = "#388e3c";
      ctx.beginPath(); ctx.ellipse(-3 * sc, 2 * sc, 3.5 * sc, 2.5 * sc, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#4caf50";
    ctx.beginPath(); ctx.ellipse(0, 0, 5.2 * sc, 3.6 * sc, fr.state === "jumping" ? -0.35 : 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#b9f6ca";
    const gulp = fr.state === "perched" ? Math.sin(vis.now * 5) * 0.7 * sc : 0;
    ctx.beginPath(); ctx.ellipse(2 * sc, 1.5 * sc + gulp * 0.5, 3 * sc, 1.6 * sc + Math.abs(gulp), 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(3.5 * sc, -2.5 * sc, 1.8 * sc, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(4 * sc, -2.5 * sc, 0.9 * sc, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });

  for (let i = vis.splashes.length - 1; i >= 0; i--) {
    const sp = vis.splashes[i];
    sp.life -= vis.dt;
    if (sp.life <= 0) { vis.splashes.splice(i, 1); continue; }
    const k = 1 - sp.life / 0.45;
    ctx.strokeStyle = `rgba(232,248,255,${(1 - k).toFixed(2)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(sx(sp.x), sy(0), (0.3 + k * 1.1) * s, (0.12 + k * 0.3) * s, 0, 0, Math.PI * 2); ctx.stroke();
  }
}

// ----- cảnh GATHER v1.1: 6 nguyên liệu, cá bơi, quái, danh sách cần lấy, cảnh báo -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 112, bottom = 86;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  const animF = Math.floor(vis.now * 10);

  // Trời ánh hồng & dừa nước
  const skyBands = ["#f2b793", "#f7ccaa", "#fbe0c6", "#e4f0e8"];
  const bandH = (SKY * s) / skyBands.length;
  skyBands.forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(0, Math.round(top + i * bandH), w, Math.ceil(bandH) + 1); });
  for (let px = 8; px <= X - 6; px += 18) {
    const sway = Math.round(Math.sin(vis.now * 1.8 + px) * 2);
    ctx.fillStyle = "#3f6e3a";
    for (let k = -2; k <= 2; k++) {
      ctx.fillRect(Math.round(sx(px) + k * 0.48 * s + sway), Math.round(oy - (1.2 - Math.abs(k) * 0.2) * s), Math.max(3, Math.round(0.32 * s)), Math.max(4, Math.round(1.1 * s)));
    }
  }

  // Nước phù sa & sóng bậc thang
  const waterBands = ui.highContrast
    ? ["#0a0e14", "#080b10", "#06080c", "#040609", "#020305", "#000000"]
    : ["#8c7c4c", "#6f7752", "#4e6d5a", "#325658", "#1d3d48", "#122733"];
  const wbH = (D * s) / waterBands.length;
  waterBands.forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(Math.round(sx(0)), Math.round(oy + i * wbH), Math.ceil(X * s), Math.ceil(wbH) + 1); });
  for (let wx = 0; wx < X; wx += 1.5) {
    const wy = Math.round(Math.sin(vis.now * 3.5 + wx * 0.7) * 2);
    ctx.fillStyle = "#f2f8e9";
    ctx.fillRect(Math.round(sx(wx)), Math.round(oy + wy - 1), Math.max(3, Math.ceil(1.6 * s)), 2);
  }
  const surfD = meta.surface_depth ?? 0.5;
  ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(sx(0), sy(surfD)); ctx.lineTo(sx(X), sy(surfD)); ctx.stroke(); ctx.setLineDash([]);
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + "m", sx(0) + 6, sy(d) - 4, { size: 18, color: "rgba(255,255,255,.45)" });
  }

  // Bến nhà sàn
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#4d331d";
  ctx.fillRect(Math.round(sx(dp[0] - 1.2)), Math.round(sy(-0.1)), Math.max(3, Math.round(0.3 * s)), Math.round(1.3 * s));
  ctx.fillRect(Math.round(sx(dp[0] + 0.9)), Math.round(sy(-0.1)), Math.max(3, Math.round(0.3 * s)), Math.round(1.3 * s));
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(Math.round(sx(dp[0] - 1.6)), Math.round(sy(-0.8)), Math.round(3.2 * s), Math.round(0.8 * s));
  ctx.fillStyle = "#b9503a";
  ctx.fillRect(Math.round(sx(dp[0] - 1.8)), Math.round(sy(-1.4)), Math.round(3.6 * s), Math.round(0.6 * s));
  ctx.fillRect(Math.round(sx(dp[0] - 1.1)), Math.round(sy(-2.0)), Math.round(2.2 * s), Math.round(0.6 * s));
  ctx.strokeStyle = "rgba(255,230,150,.75)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.35), { size: 18, align: "center", color: "#fff59d" });

  // Nút hái N1..N6 (gồm kèo nèo)
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    const bob = Math.sin(vis.now * 3.2 + n.pos[0]) * 1.8;
    const nx = sx(n.pos[0]), ny = sy(n.pos[1]) + bob;
    const sz = Math.max(22, Math.round(2.1 * s));
    ctx.globalAlpha = ready ? 1 : 0.35;
    drawSprite(PIXEL_ICON[n.kind], nx - sz / 2, ny - sz * 0.65, sz, sz * 0.72);
    ctx.globalAlpha = 1;
    text(n.id, nx, ny - sz * 0.78, { size: 18, align: "center", color: "#fff" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", nx, ny + 1.5 * s, { size: 18, align: "center", color: "#ffe082" });
  });

  // Đàn cá (3 loài: cá linh, cá lóc, cá kèo — bơi chậm, nội suy mượt)
  (snap.fish || []).forEach((f, idx) => {
    const prev = vis.fishPrev[f.id];
    const movingF = prev && Math.hypot(f.pos[0] - prev.x, f.pos[1] - prev.y) > 0.005;
    vis.fishPrev[f.id] = { x: f.pos[0], y: f.pos[1] };
    const fPos = smoothPos("fish_" + f.id, f.pos[0], f.pos[1], 0.14);
    const bob = Math.sin(vis.now * 1.3 + idx * 1.7) * 1.5;
    const driftX = movingF ? 0 : Math.sin(vis.now * 0.55 + idx * 2.1) * 0.45 * s;
    const driftHd = Math.cos(vis.now * 0.55 + idx * 2.1) >= 0 ? 0 : 180;
    const wiggle = 1 + Math.sin(vis.now * 2.4 + idx * 1.7) * 0.035;
    const fx = sx(fPos.x) + driftX, fy = sy(fPos.y) + bob;
    ctx.save();
    ctx.translate(fx, fy);
    const hd = ((movingF ? (f.heading_deg || 0) : driftHd) % 360 + 360) % 360;
    if (hd > 90 && hd < 270) { ctx.scale(-1, 1); ctx.rotate(((180 - hd) * Math.PI) / 180); }
    else ctx.rotate((hd * Math.PI) / 180);
    ctx.scale(wiggle, 1 / wiggle);
    const img = FISH_IMG[f.kind];
    if (img && img.complete && img.naturalWidth > 0) {
      const fw = (f.kind === "ca_loc" ? 2.5 : f.kind === "ca_keo" ? 2.1 : 1.8) * s;
      const fh = fw * (img.naturalHeight / img.naturalWidth);
      ctx.imageSmoothingEnabled = false;
      ctx.scale(-1, 1);
      ctx.drawImage(img, -fw / 2, -fh / 2, fw, fh);
    } else {
      ctx.fillStyle = kc(f.kind);
      ctx.fillRect(-0.9 * s, -0.4 * s, 1.8 * s, 0.8 * s);
    }
    ctx.restore();
    text(f.id, fx, fy - 1.0 * s, { size: 18, align: "center", color: "#e8eef2" });
  });

  // Thủy quái (Cá Sấu & Rắn Hổ Mây)
  const p = snap.player;
  let monsterNear = false;
  (snap.monsters || []).forEach((m) => {
    const mx = sx(m.pos[0]), my = sy(m.pos[1]);
    const mw = Math.max(32, Math.round(3.1 * s)), mh = Math.max(20, Math.round(1.7 * s));
    const dist = p ? Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) : 99;
    if (m.state === "chase" || dist <= 12) monsterNear = true;
    ctx.save();
    if (m.state === "recoil" && animF % 2 === 0) ctx.globalAlpha = 0.55;
    if (m.state === "chase") {
      ctx.strokeStyle = "#a855f7"; ctx.lineWidth = 3;
      ctx.strokeRect(Math.round(mx - mw / 2 - 4), Math.round(my - mh / 2 - 4), mw + 8, mh + 8);
    }
    ctx.translate(mx, my);
    if (p && m.state === "chase" && p.pos[0] < m.pos[0]) ctx.scale(-1, 1);
    drawSprite(PIXEL_ICON[m.kind] || PIXEL_ICON.ca_sau, -mw / 2, -mh / 2, mw, mh);
    ctx.restore();
    text(`${m.id}${m.state === "chase" ? "!" : ""}`, mx, my - mh / 2 - 6, { size: 18, align: "center", color: m.state === "chase" ? "#ea80fc" : "#ffe082" });
  });

  // Chuồn chuồn trên mặt nước & ếch nhảy ra khỏi bụi điên điển
  updateAndDrawDragonflies(sx, sy, X, s);
  updateAndDrawFrogs(snap.nodes, p, sx, sy, s);

  // Út Sen (nhân vật người có động tác bơi thật) + bong bóng ít hơn + gợi ý gần
  const underwater = p ? (p.at_surface === undefined ? p.pos[1] > surfD : !p.at_surface) : false;
  if (p) {
    const spPos = smoothPos("gather_p", p.pos[0], p.pos[1], 0.42);
    const px = sx(spPos.x), py = sy(spPos.y);
    const moving = p.vel && (Math.abs(p.vel[0]) > 0.1 || Math.abs(p.vel[1]) > 0.1);
    if (underwater) {
      vis.bubbleCd -= vis.dt;
      if (vis.bubbleCd <= 0) {
        vis.bubbleCd = moving ? 0.65 : 1.4;
        if (vis.bubbles.length < 12) {
          vis.bubbles.push({ wx: spPos.x + (Math.random() - 0.5) * 0.35, wy: spPos.y - 0.25, r: 3, ph: Math.random() * 6 });
        }
      }
    }
    for (let i = vis.bubbles.length - 1; i >= 0; i--) {
      const bb = vis.bubbles[i];
      bb.wy -= 1.8 * vis.dt;
      bb.wx += Math.sin(vis.now * 4 + bb.ph) * 0.3 * vis.dt;
      if (bb.wy <= 0) { vis.bubbles.splice(i, 1); continue; }
      ctx.fillStyle = "rgba(210,248,255,.7)";
      ctx.fillRect(Math.round(sx(bb.wx)), Math.round(sy(bb.wy)), bb.r, bb.r);
    }
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(128,216,255,.35)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,245,157,.45)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      drawUtSenSwimmer(px, py, s, p, moving, underwater);
    }
    // Gợi ý hái / cập bến / bắt cá khi đến gần
    let prompt = "";
    if (Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]) <= dr) prompt = "[E] Cập bến";
    else if (!underwater) {
      const nearN = (snap.nodes || []).find((n) => n.ready !== false && Math.hypot(p.pos[0] - n.pos[0], p.pos[1] - n.pos[1]) <= (meta.interact_radius || 2));
      if (nearN) prompt = `[E] Hái ${KIND_NAME[nearN.kind] || nearN.kind}`;
    } else if ((p.catch_cd_ticks || 0) === 0) {
      const nearF = (snap.fish || []).find((f) => Math.hypot(p.pos[0] - f.pos[0], p.pos[1] - f.pos[1]) <= (meta.catch_radius || 2));
      if (nearF) prompt = `[Space] Bắt ${KIND_NAME[nearF.kind] || nearF.kind}`;
    }
    if (prompt) {
      pixelBox(px - 105, py - 52, 210, 30, "#1d2d3e", "#090d12", "#ffe082");
      text(prompt, px, py - 31, { size: 18, align: "center", color: "#ffe082" });
    }
  }

  // Popup nổi
  for (let i = vis.floats.length - 1; i >= 0; i--) {
    const fl = vis.floats[i];
    fl.life -= vis.dt; fl.wy -= 1.2 * vis.dt;
    if (fl.life <= 0) { vis.floats.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, fl.life / 0.45);
    text(fl.label, sx(fl.wx), sy(fl.wy), { size: 18, align: "center", color: fl.color });
    ctx.globalAlpha = 1;
  }

  // Viền tím màn hình khi có thủy quái gần
  if (monsterNear && Math.floor(vis.now * 6) % 2 === 0) {
    ctx.strokeStyle = "#a855f7";
    ctx.lineWidth = 8;
    ctx.strokeRect(4, 4, w - 8, h - 8);
  }

  // HUD sáng v1.1 (sans-serif >= 18px)
  pixelBox(8, 6, w - 16, 100, "#1a232e", "#090d12", "#4b6078");
  drawSprite(PIXEL_ICON.clock, 18, 16, 22, 22);
  const lowTime = (snap.time_left_ticks || 0) <= 30 * 60;
  const timeCol = (lowTime && Math.floor(vis.now * 6) % 2 === 0) ? "#ff5252" : (lowTime ? "#ff9800" : "#ffe082");
  text(fmtTime(snap.time_left_ticks), 46, 35, { size: 22, color: timeCol });

  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const oxyS = smoothVal("oxy", p.oxygen_ticks, 0.25);
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    const oxyCol = (low && Math.floor(vis.now * 6) % 2 === 0) ? "#ff5252" : (low ? "#ef5350" : "#38c6f4");
    drawSprite(PIXEL_ICON.oxy, 132, 16, 22, 22);
    pixelBar(160, 14, 210, 26, oxyS / p.oxygen_max_ticks, oxyCol, p.oxygen_ticks === 0 ? "Hết hơi!" : ("Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s"), 10);
  }
  if (p && p.hp !== undefined && p.hp_max) {
    for (let i = 0; i < p.hp_max; i++) {
      drawSprite(i < p.hp ? PIXEL_ICON.heartFull : PIXEL_ICON.heartEmpty, 386 + i * 24, 17, 22, 20);
    }
    text(`${p.hp}/${p.hp_max}`, 392 + p.hp_max * 24, 34, { size: 19, color: "#ff8fa3" });
  }
  if (p && p.pos) {
    text(`Sâu ${p.pos[1].toFixed(1)}m`, 575, 34, { size: 18, color: "#cfd8dc" });
  }
  if (p && p.catch_cd_ticks > 0) {
    text(`Hồi ${(p.catch_cd_ticks / 60).toFixed(1)}s`, 690, 34, { size: 18, color: "#ffd54f" });
  }
  const dayStr = snap.day ? `Ngày ${snap.day} · ` : "";
  text(`${dayStr}FPS ${Math.round(vis.fps)}`, w - 22, 34, { size: 18, align: "right", color: "#b9f6ca" });

  // Hàng 2 HUD: danh sách cần lấy "đã lấy/cần" + cảnh báo "Thủy quái!" / "Hết hơi!"
  const holdCounts = {};
  (snap.hold || []).forEach((it) => { if (isSpoiledItem(it)) return; const k = itemKind(it); holdCounts[k] = (holdCounts[k] || 0) + 1; });
  const planIng = (snap.day_plan && snap.day_plan.ingredients) ? snap.day_plan.ingredients : null;
  if (planIng) {
    const parts = Object.keys(planIng).sort().map((k) => `${KIND_NAME[k] || k} ${holdCounts[k] || 0}/${planIng[k]}`);
    text("Cần: " + parts.join(" · "), 18, 78, { size: 18, color: "#b9f6ca" });
  } else {
    text(underwater ? "Dưới nước: [Space] bắt cá" : "Mặt nước: [E] hái rau / cập bến", 18, 78, { size: 18, color: underwater ? "#80d8ff" : "#b9f6ca" });
  }
  let alertX = w - 22;
  const lowOxy = p && p.oxygen_max_ticks && (p.oxygen_ticks / p.oxygen_max_ticks) < 0.25;
  if (lowOxy) {
    const chokeMax = meta.choke_interval_ticks || 60;
    const oxyMsg = p.oxygen_ticks === 0 ? `Hết hơi! ${p.zero_oxy_ticks || 0}/${chokeMax}` : `Hết hơi! ${Math.ceil(p.oxygen_ticks / 60)}s`;
    pixelBox(alertX - 224, 54, 224, 34, "#7f1d1d", "#090d12", "#ff5252");
    drawSprite(PIXEL_ICON.warnOxy, alertX - 216, 61, 20, 20);
    text(oxyMsg, alertX - 100, 78, { size: 19, align: "center", color: "#ffffff" });
    alertX -= 236;
  }
  if (monsterNear) {
    pixelBox(alertX - 190, 54, 190, 34, "#4a148c", "#090d12", "#ea80fc");
    drawSprite(PIXEL_ICON.warnMonster, alertX - 182, 61, 20, 20);
    text("Thủy quái!", alertX - 80, 78, { size: 20, align: "center", color: "#ffffff" });
  }

  // Giỏ dưới (12 ô + chữ >= 18px)
  pixelBox(8, h - bottom + 4, w - 16, bottom - 10, "#1a232e", "#090d12", "#4b6078");
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = 44, y0 = h - bottom + 14;
    let freshSum = 0, freshN = 0, spoiledN = 0;
    for (let i = 0; i < cap; i++) {
      const it = snap.hold[i];
      const f = itemFresh(it);
      const spoiled = f !== null && f < SPOILED_BELOW;
      const x0 = 18 + i * (sz + 4);
      const isTop = it && i === snap.hold.length - 1;
      pixelBox(x0, y0, sz, sz, "#101720", "#080b10", spoiled ? "#ef5350" : ((isTop && animF % 4 < 2) ? "#ffe082" : "#324152"));
      if (it) {
        ctx.globalAlpha = spoiled ? 0.4 : 1;
        drawItemIcon(itemKind(it), x0 + sz / 2, y0 + sz / 2 - 4, sz - 14);
        ctx.globalAlpha = 1;
        if (f !== null) {
          freshSum += f; freshN += 1; if (spoiled) spoiledN += 1;
          pxRect(x0 + 4, y0 + sz - 10, sz - 8, 5, "#0b1016");
          pxRect(x0 + 4, y0 + sz - 10, (sz - 8) * Math.max(0, Math.min(100, f)) / 100, 5, freshColor(f));
        }
        if (spoiled) text("ƯƠN", x0 + sz / 2, y0 + sz / 2 + 4, { size: 18, align: "center", color: "#ff8a80" });
      }
    }
    const sxTxt = 24 + cap * (sz + 4);
    const fullWarn = snap.hold.length >= cap ? " · GIỎ ĐẦY!" : "";
    const freshTxt = freshN ? ` · Tươi TB ${Math.round(freshSum / freshN)}${spoiledN ? " · ƯƠN " + spoiledN : ""}` : "";
    const sum = freshN
      ? `Giỏ ${snap.hold.length}/${cap}${freshTxt}${fullWarn}`
      : `Giỏ ${snap.hold.length}/${cap}${Object.keys(holdCounts).length ? "  " + fmtItems(holdCounts) : " (trống)"}${fullWarn}`;
    text(sum, sxTxt, y0 + 28, { size: 18, color: spoiledN ? "#ffab91" : (snap.hold.length >= cap ? "#ff8a80" : "#f4eedc") });
  }
  text("[WASD] Bơi · [E] Hái/Bến · [Space] Bắt · [H] Tương phản · [P/Esc] Dừng", w - 22, h - 22, { size: 18, align: "right", color: "#cfd8dc" });
}

// Dòng HUD độ tươi kho quán (v1.2): mỗi loại một chip màu theo độ tươi thấp nhất, nhãn "ƯƠN n" khi có hàng ươn
function drawFreshStockLine(items, x, y) {
  const head = "Độ tươi kho:";
  text(head, x, y, { size: 18, color: "#b9f6ca" });
  x += ctx.measureText(head).width + 14;
  const groups = {};
  items.forEach((it) => {
    const g = groups[it.kind] || (groups[it.kind] = { n: 0, min: 100, spoiled: 0 });
    g.n += 1; g.min = Math.min(g.min, it.fresh); if (it.fresh < SPOILED_BELOW) g.spoiled += 1;
  });
  const kinds = Object.keys(groups).sort();
  if (!kinds.length) { text("(trống)", x, y, { size: 18, color: "#cfd8dc" }); return; }
  kinds.forEach((k) => {
    const g = groups[k], col = freshColor(g.min);
    const label = `${KIND_NAME[k] || k}×${g.n} ${g.spoiled ? "ƯƠN " + g.spoiled : Math.round(g.min)}`;
    pxRect(x, y - 13, 11, 11, col);
    text(label, x + 17, y, { size: 18, color: col });
    x += 17 + ctx.measureText(label).width + 20;
  });
}

// ----- cảnh QUÁN v1.1 (Góc nhìn 2.5D Pixel Art + sắp lớp chiều sâu z-sort): 2 bếp, 4 bàn, 6 món, HUD sans-serif >= 18px -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const freshMode = Array.isArray(snap.stock);   // v1.2: kho cá thể -> thêm dòng "Độ tươi kho"
  const hudH = freshMode ? 146 : 114;
  const X = b.x[1], Z = b.z[1], top = freshMode ? 160 : 128, bottom = 56;
  const zRatio = 0.72;
  const s = Math.max(20, Math.min((w - 84) / X, (h - top - bottom - 96) / (Z * zRatio)));
  const zS = s * zRatio;
  const deckW = X * s, deckH = Z * zS;
  const ox = (w - deckW) / 2, oy = top + 52;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * zS;
  const animF = Math.floor(vis.now * 10);

  // Sông đêm, trăng khuyết & rặng dừa nước xa
  ctx.fillStyle = "#071420";
  ctx.fillRect(0, top, w, h - top - bottom);
  pxRect(0, top, w, 46, "#091b2b");
  // Rặng cây dừa nước tối bên bờ xa
  for (let kx = 10; kx < w; kx += 48) {
    const kh = 16 + (kx * 17) % 18;
    pxRect(kx, top + 46 - kh, 38, kh, "#0d211d");
  }
  // Trăng khuyết & ánh trăng trên mặt nước
  pxRect(42, top + 14, 12, 12, "#ffe999");
  pxRect(44, top + 12, 8, 16, "#ffe999");
  pxRect(48, top + 16, 4, 4, "#e6cc7a");
  // Gợn sóng sông đêm lấp lánh
  for (let wy = top + 56; wy < h - bottom - 8; wy += 24) {
    const drift = Math.sin(vis.now * 1.4 + wy * 0.2) * 14;
    for (let wx = 20; wx < w - 40; wx += 110) {
      if (wx > ox - 20 && wx < ox + deckW + 10 && wy > oy && wy < oy + deckH + 22) continue;
      ctx.fillStyle = "rgba(130, 195, 235, 0.16)";
      ctx.fillRect(Math.round(wx + drift), wy, 26, 2);
      ctx.fillStyle = "rgba(255, 224, 130, 0.12)";
      ctx.fillRect(Math.round(wx + drift + 48), wy + 9, 16, 2);
    }
  }

  // Xuồng ba lá neo mạn trái bè
  const boatX = Math.max(16, ox - 56);
  const boatY = sy(3.6) + Math.round(Math.sin(vis.now * 1.8) * 3);
  if (ox > 68) {
    ctx.strokeStyle = "#8a6d46"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ox, sy(4.3)); ctx.lineTo(boatX + 36, boatY - 8); ctx.stroke();
    drawBlock25D(boatX + 18, boatY + 20, 34, 68, 8, "#7d4f27", "#4f3014", "#1b0f06");
    pxRect(boatX + 6, boatY - 40, 24, 44, "#402611");
    pxRect(boatX + 5, boatY - 22, 26, 6, "#9c6635");
  }

  // Bóng bè dưới mặt nước + phao bè mặt trước + dầm gỗ mặt đứng (extruded 2.5D)
  ctx.fillStyle = "rgba(3, 9, 15, 0.55)";
  ctx.fillRect(Math.round(ox - 8), Math.round(oy + 10), Math.round(deckW + 16), Math.round(deckH + 28));
  const beamH = 20;
  // Phao thùng phuy / bè tre nổi dưới đáy bè
  for (let px = 0.6; px < X - 0.5; px += 2.2) {
    const bobP = Math.round(Math.sin(vis.now * 2.2 + px) * 1.5);
    const fx = Math.round(sx(px));
    pxRect(fx, oy + deckH + beamH - 3 + bobP, Math.round(1.3 * s), 9, "#2d4c5c");
    pxRect(fx + 2, oy + deckH + beamH - 1 + bobP, Math.round(1.3 * s - 4), 2, "#608c9e");
  }
  ctx.fillStyle = "rgba(180,235,255,0.28)";
  ctx.fillRect(Math.round(ox - 6), Math.round(oy + deckH + beamH + 6), Math.round(deckW + 12), 2);

  // Vách mặt đứng phía trước của sàn nhà bè
  pxRect(ox - 6, oy + deckH, deckW + 12, beamH, "#5a391c");
  pxRect(ox - 6, oy + deckH + beamH - 4, deckW + 12, 4, "#3b230e");
  for (let bx = 0; bx <= X; bx += 2) {
    pxRect(sx(bx) - 2, oy + deckH, 5, beamH, "#3b230e");
  }

  // Sàn ván gỗ 2.5D nhà bè (x = 0..X, z = 0..Z)
  pxRect(ox - 6, oy - 6, deckW + 12, deckH + 8, "#3e2612");
  pxRect(ox, oy, deckW, deckH, "#c5965d");
  // Khe ván gỗ ngang (tạo cảm giác chiều sâu) + ván dọc
  for (let gz = 1; gz < Z; gz += 1) {
    pxRect(ox, sy(gz), deckW, 2, "rgba(92, 58, 28, 0.28)");
  }
  for (let gx = 2; gx < X; gx += 2) {
    pxRect(sx(gx), oy, 2, deckH, "rgba(92, 58, 28, 0.22)");
  }
  // Nền gạch khu bếp (góc trái trên: x < 7, z > 6)
  pxRect(sx(0.3), sy(9.8), 6.6 * s, 3.3 * zS, "#996942");
  pxRect(sx(0.4), sy(9.7), 6.4 * s, 3.1 * zS, "#a8764b");

  // Lan can gỗ hậu cảnh (z = Z), bảng hiệu "QUÁN MÁ TƯ" & giàn đèn dây vàng ấm
  pxRect(ox - 4, oy - 22, deckW + 8, 22, "#4b2e16");
  pxRect(ox - 4, oy - 24, deckW + 8, 4, "#7a4d27");
  for (let px = 0; px <= X; px += 4) {
    pxRect(sx(px) - 4, oy - 34, 8, 36, "#5c391c");
    pxRect(sx(px) - 3, oy - 34, 3, 34, "#85552d");
  }
  pixelBox(sx(8) - 96, oy - 38, 192, 26, "#4d2712", "#1a0c04", "#e0a958");
  text("QUÁN MÁ TƯ", sx(8), oy - 19, { size: 18, align: "center", color: "#ffe082" });

  // Dây đèn lồng vàng dọc hậu cảnh + quầng sáng xuống sàn
  ctx.strokeStyle = "#2b1b0e"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(sx(0), oy - 30);
  for (let lx = 1; lx <= X; lx += 1) {
    ctx.lineTo(sx(lx), oy - 30 + Math.sin((lx % 4) * Math.PI / 4) * 7);
  }
  ctx.stroke();
  for (let lx = 0.8; lx < X; lx += 1.6) {
    const glow = 0.68 + 0.32 * Math.sin(vis.now * 4 + lx * 2);
    const lpx = Math.round(sx(lx)), lpy = Math.round(oy - 26 + Math.sin((lx % 4) * Math.PI / 4) * 6);
    ctx.fillStyle = `rgba(255, 224, 102, ${(glow * 0.16).toFixed(2)})`;
    ctx.beginPath(); ctx.ellipse(lpx, oy + 14, 24, 10, 0, 0, Math.PI * 2); ctx.fill();
    pxRect(lpx - 3, lpy, 6, 7, `rgba(255, 214, 79, ${glow.toFixed(2)})`);
    pxRect(lpx - 1, lpy + 2, 2, 3, "#fffde7");
  }

  // Vòng tròn bán kính tương tác trên mặt sàn 2.5D (nén theo zRatio)
  const p = snap.player;
  const spPos = p ? smoothPos("quan_p", p.pos[0], p.pos[1], 0.42) : null;
  if (p && meta.interact_radius) {
    ctx.strokeStyle = "rgba(255,248,200,0.42)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.ellipse(sx(spPos.x), sy(spPos.y), meta.interact_radius * s, meta.interact_radius * zS, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 1;
  }

  // Chuẩn bị dữ liệu vẽ & sắp lớp chiều sâu (z lớn ở xa vẽ trước, z nhỏ ở gần vẽ sau)
  const menu = snap.tuning_menu || {};
  const patMax = (meta.patience_s || 60) * 60;
  const eatMax = (meta.eat_s || 10) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));

  const renderables = [];
  (snap.stoves || []).forEach((st) => renderables.push({ kind: "stove", z: st.pos[1], st, bx: sx(st.pos[0]), by: sy(st.pos[1]) }));
  (snap.tables || []).forEach((tb) => renderables.push({ kind: "table", z: tb.pos[1], tb, c: byTable[tb.id], tx: sx(tb.pos[0]), ty: sy(tb.pos[1]) }));
  if (p && spPos) renderables.push({ kind: "player", z: spPos.y, p, px: sx(spPos.x), py: sy(spPos.y) });
  renderables.sort((a, b) => b.z - a.z);

  // Pass 1: Vẽ hình khối 2.5D theo thứ tự chiều sâu z
  renderables.forEach((item) => {
    if (item.kind === "stove") drawStove25D(item.st, item.bx, item.by, s, animF);
    else if (item.kind === "table") drawTableAndCustomer25D(item.tb, item.c, item.tx, item.ty, s, patMax);
    else if (item.kind === "player") {
      const prevQ = vis.quanPrev || { x: item.p.pos[0], z: item.p.pos[1] };
      const rawDx = item.p.vel ? item.p.vel[0] : (item.p.pos[0] - prevQ.x);
      const rawDz = item.p.vel ? item.p.vel[1] : (item.p.pos[1] - prevQ.z);
      vis.quanPrev = { x: item.p.pos[0], z: item.p.pos[1] };
      const hasStep = item.p.vel ? Math.hypot(rawDx, rawDz) > 0.1 : Math.hypot(rawDx, rawDz) > 0.002;
      vis.quanMoveHold = hasStep ? 0.12 : Math.max(0, (vis.quanMoveHold || 0) - vis.dt);
      const vScale = item.p.vel ? 1 : 60;
      drawUtSen25D(item.px, item.py, s, hasStep ? rawDx * vScale : 0, hasStep ? rawDz * vScale : 0, vis.quanMoveHold > 0, snap.hand);
    }
  });

  // Pass 2: Nhãn & thanh tiến độ (không bị thân vật cản chữ, luôn sắc nét >= 18px)
  (snap.stoves || []).forEach((st) => {
    const bx = sx(st.pos[0]), by = sy(st.pos[1]);
    const headY = by - 0.65 * s - 0.72 * s;
    if (st.dish) text(dishName(st.dish), bx, headY - 12, { size: 18, align: "center", color: "#ffe082" });
    if (st.state === "cooking") {
      const dId = st.dish ? (st.dish.dish_id || st.dish) : "";
      const cookTotal = (menu[dId] ? menu[dId].cook_s : 6) * 60;
      const cookSm = smoothVal("cook_" + st.id, st.cook_ticks_left || 0, 0.25);
      pixelBar(bx - 0.85 * s, by + 6, 1.7 * s, 22, 1 - cookSm / Math.max(1, cookTotal), "#ffb300", Math.ceil((st.cook_ticks_left || 0) / 60) + "s", 6);
    } else if (st.state === "ready") {
      text("CHÍN [E]", bx, by + 24, { size: 18, align: "center", color: "#b9f6ca" });
    }
  });

  (snap.tables || []).forEach((tb) => {
    const c = byTable[tb.id];
    if (!c) return;
    const tx = sx(tb.pos[0]), ty = sy(tb.pos[1]);
    const lowPat = c.state !== "eating" && c.patience_ticks_left !== undefined && (c.patience_ticks_left / patMax) < 0.25;
    const cx = tx + (lowPat ? Math.round(Math.sin(vis.now * 28) * 2) : 0);
    const scT = Math.max(1.0, s * 0.040);
    const labelY = ty - 0.46 * s * 1.15 - 0.36 * s * 0.4 - 27 * scT;
    if (lowPat) drawSprite(PIXEL_ICON.warnAngry, cx - 12, labelY - 40, 24, 24);
    text(`${c.id}: ${dishName(c.dish_id)}`, cx, labelY, { size: 18, align: "center", color: lowPat ? "#ff8a80" : "#fff" });
    if (c.state === "eating") {
      const left = c.eat_ticks_left || 0;
      pixelBar(cx - 0.9 * s, ty + 8, 1.8 * s, 22, smoothVal("eat_" + c.id, left, 0.25) / eatMax, "#66bb6a", "Ăn " + Math.ceil(left / 60) + "s", 6);
    } else if (c.patience_ticks_left !== undefined) {
      const frac = c.patience_ticks_left / patMax;
      const pCol = frac >= 0.5 ? "#66bb6a" : (frac >= 0.25 ? "#ffca28" : (Math.floor(vis.now * 6) % 2 === 0 ? "#ff5252" : "#d32f2f"));
      pixelBar(cx - 0.9 * s, ty + 8, 1.8 * s, 22, smoothVal("pat_" + c.id, c.patience_ticks_left, 0.25) / patMax, pCol, Math.ceil(c.patience_ticks_left / 60) + "s", 8);
    }
  });

  if (p && spPos && snap.hand) {
    text(dishWithOrder(snap.hand), sx(spPos.x), sy(spPos.y) - 0.044 * s * 36 - 10, { size: 18, align: "center", color: "#ffe082" });
  }

  for (let i = vis.floats.length - 1; i >= 0; i--) {
    const fl = vis.floats[i];
    fl.life -= vis.dt; fl.wy += 0.9 * vis.dt;
    if (fl.life <= 0) { vis.floats.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, fl.life / 0.45);
    text(fl.label, sx(fl.wx), sy(fl.wy), { size: 18, align: "center", color: fl.color });
    ctx.globalAlpha = 1;
  }

  // HUD Quán v1.1 (sans-serif >= 18px)
  pixelBox(8, 6, w - 16, hudH, "#1a232e", "#090d12", "#4b6078");
  drawSprite(PIXEL_ICON.clock, 18, 14, 22, 22);
  const lowT = (snap.time_left_ticks || 0) <= 30 * 60;
  text(fmtTime(snap.time_left_ticks), 46, 33, { size: 22, color: lowT ? "#ff5252" : "#ffe082" });
  drawSprite(animF % 4 < 2 ? PIXEL_ICON.coin0 : PIXEL_ICON.coin1, 134, 14, 22, 22);
  text(`Tiền ${snap.money ?? 0}k`, 162, 33, { size: 20, color: "#ffd54f" });
  drawSprite(PIXEL_ICON.star, 310, 14, 22, 22);
  text(`Uy tín ${(snap.reputation ?? 0).toFixed(1)}`, 338, 33, { size: 20, color: "#ffe082" });
  text(`Điểm ${snap.score ?? 0}`, 485, 33, { size: 20, color: "#b9f6ca" });
  text(`${snap.day ? "Ngày " + snap.day + " · " : ""}FPS ${Math.round(vis.fps)}`, w - 22, 33, { size: 18, align: "right", color: "#b9f6ca" });

  const { avail, reserved } = computeAvailableStock(snap.stock, snap.customers);
  const resTxt = fmtItems(reserved);
  text("Kho khả dụng: " + (fmtItems(avail) || "(trống)") + (resTxt ? " · Giữ: " + resTxt : ""), 18, 68, { size: 18, color: "#b9f6ca" });

  const stTxt = (snap.stoves || []).map((st) => {
    if (st.state === "cooking") return `${st.id}: Nấu ${dishName(st.dish)} (${Math.ceil((st.cook_ticks_left || 0) / 60)}s)`;
    if (st.state === "ready") return `${st.id}: CHÍN ${dishName(st.dish)}`;
    return `${st.id}: Rảnh`;
  }).join(" | ") || "Bếp: --";
  const handTxt = snap.hand ? dishWithOrder(snap.hand) : "(trống)";
  text(`${stTxt}  ·  Tay: ${handTxt}`, 18, 102, { size: 18, color: "#ffe0b2" });
  const angryCount = (snap.customers || []).filter((c) => c.state !== "eating" && c.patience_ticks_left !== undefined && (c.patience_ticks_left / patMax) < 0.25).length;
  if (angryCount > 0) {
    pixelBox(w - 260, 50, 244, 34, "#7f1d1d", "#090d12", "#ff5252");
    drawSprite(PIXEL_ICON.warnAngry, w - 250, 57, 20, 20);
    text(angryCount > 1 ? `Khách sắp giận (${angryCount})!` : "Khách sắp giận!", w - 126, 74, { size: 18, align: "center", color: "#ffffff" });
  }
  if (freshMode) drawFreshStockLine(snap.stock, 18, 134);

  pixelBox(8, h - bottom + 4, w - 16, bottom - 10, "#1a232e", "#090d12", "#4b6078");
  drawButton(`[H] Tương phản: ${ui.highContrast ? "BẬT" : "TẮT"}`, 18, h - bottom + 12, 230, 36, () => { ui.highContrast = !ui.highContrast; }, ui.highContrast ? "#111111" : "#223142", ui.highContrast ? "#ffea00" : "#6ea0cc");
  text("[WASD] Đi · [E] Bếp/Bàn · [H] Tương phản · [P/Esc] Dừng · [R] Chơi lại", w - 22, h - 18, { size: 18, align: "right", color: "#cfd8dc" });
}

function demoBuy(kind) {
  const shop = (snap && snap.tuning_shop && snap.tuning_shop.upgrades) || {};
  const list = shop[kind] || [];
  const lvl = ui.demoUpgrades[kind] || 0;
  if (lvl >= list.length) { ui.demoMsg = "Đã nâng cấp tối đa!"; return; }
  const price = list[lvl].price;
  if (ui.demoMoney < price) { ui.demoMsg = "Không đủ tiền!"; return; }
  ui.demoMoney -= price;
  ui.demoUpgrades[kind] = lvl + 1;
  ui.demoMsg = `Đã mua ${kind === "oxygen" ? "Oxy" : "Áo phao"} cấp ${lvl + 1} (-${price}k)!`;
}

function frame() {
  requestAnimationFrame(frame);
  const now = performance.now() / 1000;
  vis.dt = Math.min(0.05, Math.max(0.001, now - vis.now));
  vis.now = now;
  vis.fps = vis.fps * 0.9 + Math.min(240, 1 / vis.dt) * 0.1;
  ui.buttons = [];

  const [w, h] = fit();
  ctx.fillStyle = "#0c1218"; ctx.fillRect(0, 0, w, h);
  if (!snap) {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 22 });
    return;
  }
  syncUiState();

  const ph = snap.phase || snap.mode;
  if (ph === "quan") drawQuan(w, h); else drawGather(w, h);

  if (ui.screen === "menu") {
    ctx.fillStyle = "rgba(8,12,18,0.72)"; ctx.fillRect(0, 0, w, h);
    drawMenuScreen(w, h);
  } else if (ui.screen === "day_intro") {
    ctx.fillStyle = "rgba(8,12,18,0.75)"; ctx.fillRect(0, 0, w, h);
    drawDayIntro(w, h);
  } else if (ui.screen === "evening_intro") {
    ctx.fillStyle = "rgba(8,12,18,0.75)"; ctx.fillRect(0, 0, w, h);
    drawEveningIntro(w, h);
  } else if (ui.screen === "day_result") {
    ctx.fillStyle = "rgba(8,12,18,0.75)"; ctx.fillRect(0, 0, w, h);
    drawDayResult(w, h);
  } else if (ui.screen === "shop") {
    ctx.fillStyle = "rgba(8,12,18,0.78)"; ctx.fillRect(0, 0, w, h);
    drawShopScreen(w, h);
  } else if (ui.screen === "summary") {
    ctx.fillStyle = "rgba(8,12,18,0.8)"; ctx.fillRect(0, 0, w, h);
    drawSummaryScreen(w, h);
  } else if (ui.screen === "exit") {
    ctx.fillStyle = "rgba(8,12,18,0.85)"; ctx.fillRect(0, 0, w, h);
    pixelBox(w / 2 - 240, h / 2 - 100, 480, 200, "#182330", "#080b0f", "#6ea0cc");
    text("Cảm ơn bạn đã ghé Quán Ăn Chợ Nổi!", w / 2, h / 2 - 30, { size: 22, align: "center", color: "#ffe082" });
    drawButton("Quay lại Menu", w / 2 - 120, h / 2 + 20, 240, 48, () => { ui.screen = "menu"; });
  }
  overlay(w, h);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
